<!doctype html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="ui.css">
<style>body { width: 300px; padding: 14px; }</style>
</head>
<body>
  <header class="row between">
    <strong class="brand">Calm Feed</strong>
    <label class="switch" title="Filter on/off"><input type="checkbox" id="enabled"><span></span></label>
  </header>

  <div class="big"><span id="today">0</span><small>posts hidden today</small></div>
  <div class="split" id="split"></div>
  <div class="muted tiny" id="bysite"></div>
  <div class="spark-wrap" title="Hidden posts, last 7 days">
    <svg id="spark" class="spark" viewBox="0 0 272 36" preserveAspectRatio="none" aria-label="Hidden posts over the last 7 days"></svg>
    <div class="row between muted tiny"><span id="spark-from"></span><span>last 7 days</span><span>today</span></div>
  </div>

  <div class="field">
    <label for="threshold" class="row between"><span>Ragebait sensitivity</span><span id="tval" class="muted"></span></label>
    <input type="range" id="threshold" min="0.3" max="0.9" step="0.05">
  </div>
  <div class="field">
    <label for="slopThreshold" class="row between"><span>Slop sensitivity</span><span id="sval" class="muted"></span></label>
    <input type="range" id="slopThreshold" min="0.4" max="0.95" step="0.05">
    <div class="row between muted tiny"><span>strict</span><span>lenient</span></div>
  </div>

  <div class="row between">
    <span>Claude classification</span>
    <span id="llm" class="pill"></span>
  </div>
  <div id="err" class="err" hidden></div>

  <div class="row" style="gap:8px">
    <button id="dash" class="btn primary" style="flex:1">Open dashboard</button>
    <button id="opts" class="btn" style="flex:1">Settings</button>
  </div>
  <script src="src/common.js"></script>
  <script src="popup.js"></script>
</body>
</html>
